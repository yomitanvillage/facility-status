<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>読谷村 くらしの案内板</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGZF9RQER9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZGZF9RQER9');
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <script src="config.js"></script>
  <script src="status-engine.js"></script>

  <style>
    /* ══════════════════════════════════════
       トークン
    ══════════════════════════════════════ */
    :root {
      --bg:         #f2f4f0;
      --surface:    #ffffff;
      --border:     #dde5d8;
      --fg:         #1a1e18;
      --fg-sub:     #5a6357;
      --accent:     #2d6a4f;
      --open-bg:    #e8f4ed;
      --open-fg:    #1b4332;
      --open-dot:   #2d9e5f;
      --notice-bg:  #fff7e0;
      --notice-fg:  #7a5200;
      --notice-dot: #d4a017;
      --closed-bg:  #fdecea;
      --closed-fg:  #7f1d1d;
      --closed-dot: #d94f3d;
      --header-h:   52px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:         #161a14;
        --surface:    #1f241d;
        --border:     #2e3829;
        --fg:         #e8ede5;
        --fg-sub:     #8a9686;
        --accent:     #52b788;
        --open-bg:    #1a2e22;
        --open-fg:    #86efac;
        --open-dot:   #4ade80;
        --notice-bg:  #2a2000;
        --notice-fg:  #fcd34d;
        --notice-dot: #fbbf24;
        --closed-bg:  #2a1010;
        --closed-fg:  #fca5a5;
        --closed-dot: #f87171;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:         #161a14;
      --surface:    #1f241d;
      --border:     #2e3829;
      --fg:         #e8ede5;
      --fg-sub:     #8a9686;
      --accent:     #52b788;
      --open-bg:    #1a2e22;
      --open-fg:    #86efac;
      --open-dot:   #4ade80;
      --notice-bg:  #2a2000;
      --notice-fg:  #fcd34d;
      --notice-dot: #fbbf24;
      --closed-bg:  #2a1010;
      --closed-fg:  #fca5a5;
      --closed-dot: #f87171;
      color-scheme: dark;
    }

    /* ══════════════════════════════════════
       ベース
    ══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding-left:  max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--accent);
      z-index: 21;
    }

    /* ══════════════════════════════════════
       ヘッダー
    ══════════════════════════════════════ */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      background: var(--accent);
      color: #fff;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      margin-left:  calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
      margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }
    .header-live  { display: flex; align-items: center; gap: 6px; font-size: 11px; opacity: 0.85; }
    .live-dot {
      width: 7px; height: 7px;
      background: #a3e4b8;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ══════════════════════════════════════
       サマリーバー
    ══════════════════════════════════════ */
    .summary-bar {
      display: flex;
      gap: 8px;
      padding: 12px 0 4px;
      flex-wrap: wrap;
    }
    .summary-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg-sub);
      font-size: 12px;
      font-weight: 500;
    }
    .summary-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-open   { background: var(--open-dot); }
    .dot-notice { background: var(--notice-dot); }
    .dot-closed { background: var(--closed-dot); }

    /* ══════════════════════════════════════
       グリッド
    ══════════════════════════════════════ */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding-block: 8px 24px;
      align-items: start;   /* 行ごとに高さを揃える（stretch） */
    }

    /* ══════════════════════════════════════
       カード（グリッド用）
    ══════════════════════════════════════ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s;
      user-select: none;
      /* 同じ行のカードは同じ高さになる（CSS grid stretch） */
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .card:active { transform: scale(0.97); }
    .card.open   { border-left-color: var(--open-dot); }
    .card.notice { border-left-color: var(--notice-dot); }
    .card.closed { border-left-color: var(--closed-dot); }

    .card-top {
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;   /* カード内でcard-topが伸びてタップ面積を確保 */
    }
    .card.closed .card-top { background: var(--closed-bg); }
    .card.notice .card-top { background: var(--notice-bg); }

    /* アイコン行 */
    .card-icon-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
    }
    .card-icon {
      width: 32px; height: 32px;
      flex-shrink: 0;
      color: var(--fg-sub);
    }
    .card-icon svg {
      width: 100%; height: 100%;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .card.closed .card-icon { color: var(--closed-fg); opacity: 0.7; }
    .card.notice .card-icon { color: var(--notice-fg); opacity: 0.85; }

    /* バッジ群（縦並び、右寄せ） */
    .badge-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      white-space: nowrap;
    }
    .badge .bdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .badge-open   { background: var(--open-bg);   color: var(--open-fg);   border-color: var(--open-dot); }
    .badge-open   .bdot { background: var(--open-dot); }
    .badge-closed { background: var(--closed-bg); color: var(--closed-fg); border-color: var(--closed-dot); }
    .badge-closed .bdot { background: var(--closed-dot); }

    /* 予告ピル */
    .notice-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1.5px solid var(--notice-dot);
      background: var(--notice-bg);
      color: var(--notice-fg);
      white-space: nowrap;
    }
    .notice-pill svg {
      width: 12px; height: 12px;
      stroke: var(--notice-dot);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      flex-shrink: 0;
    }

    /* サービス名 */
    .card-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--fg);
    }
    .card.closed .card-name { color: var(--closed-fg); }

    /* タップヒント（カード下部） */
    .card-tap-hint {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      padding: 6px 14px 12px;
      margin-top: auto;   /* card-topが伸びた分、下に押しつける */
    }

    /* ══════════════════════════════════════
       ごみ収集カード（フルワイド）
    ══════════════════════════════════════ */
    .gomi-card {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .gomi-card.open   { border-left-color: var(--open-dot); }
    .gomi-card.closed { border-left-color: var(--closed-dot); }

    .gomi-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .gomi-header .card-icon { flex-shrink: 0; }
    .gomi-title-wrap { flex: 1; min-width: 0; }
    .gomi-title { font-size: 15px; font-weight: 700; }
    .gomi-today-date { font-size: 11px; color: var(--fg-sub); margin-top: 3px; }
    .gomi-today-row {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center;
    }
    .gomi-today-none { font-size: 11px; color: var(--fg-sub); }
    .gomi-status-area { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .gomi-expand-hint {
      font-size: 11px; font-weight: 600; color: var(--accent);
      padding: 4px 14px 10px; text-align: right;
    }

    .gomi-status-detail {
      padding: 8px 14px 10px;
      background: var(--closed-bg);
      font-size: 12px;
      line-height: 1.6;
    }
    .gomi-status-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
    .gomi-status-detail dt { font-weight: 600; color: var(--fg-sub); white-space: nowrap; }
    .gomi-status-detail dd { color: var(--fg); white-space: pre-wrap; min-width: 0; }

    .gomi-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .gomi-area-label { font-size: 12px; color: var(--fg-sub); margin: 10px 0 5px; display: block; }
    .gomi-select {
      width: 100%; padding: 8px 10px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--fg);
      margin-bottom: 10px; font-family: inherit;
      -webkit-appearance: none;
    }
    .gomi-select:focus { outline: none; border-color: var(--accent); }

    .gomi-day-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .gomi-day-label  { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .gomi-today    { font-size: 11px; font-weight: 700; background: var(--open-bg);   color: var(--open-fg);   padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
    .gomi-tomorrow { font-size: 11px; font-weight: 700; background: var(--notice-bg); color: var(--notice-fg); padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
    .gomi-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .gomi-tag  { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .gomi-moe  { background: #d8f3dc; color: #1b4332; }
    .gomi-moe2 { background: #dce8fa; color: #1a3a6b; }
    .gomi-pet  { background: #fef3dc; color: #7a4f00; }
    .gomi-bin  { background: #fce8f0; color: #7f1d3a; }
    .gomi-koshi { background: var(--bg); color: var(--fg-sub); border: 1px solid var(--border); }

    .gomi-notes { margin-top: 8px; }
    .gomi-note-row {
      display: flex; align-items: flex-start; gap: 6px;
      font-size: 13px; color: var(--fg-sub); margin-bottom: 5px; line-height: 1.6;
    }
    .gomi-note-icon { flex-shrink: 0; }
    .gomi-note-row a { color: var(--accent); }

    .gomi-typhoon-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--fg-sub);
      background: none; border: none; padding: 0;
      cursor: pointer; font-family: inherit;
      width: 100%; text-align: left;
    }
    .gomi-typhoon-body {
      margin-top: 8px; padding: 10px 12px;
      background: var(--bg); border-radius: 8px;
      font-size: 13px; color: var(--fg-sub); line-height: 1.7;
      border-left: 3px solid var(--accent);
    }
    .gomi-typhoon-body p { margin-bottom: 5px; }
    .gomi-typhoon-body p:last-child { margin-bottom: 0; }

    /* マップリンクボタン（シート内で使用） */
    .map-link-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600;
      color: var(--accent); background: var(--open-bg);
      border: 1px solid var(--open-dot); border-radius: 8px;
      padding: 6px 12px; text-decoration: none; margin: 6px 0;
    }

    /* フッター */
    .page-foot {
      text-align: center;
      font-size: 11px;
      color: var(--fg-sub);
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      opacity: 0.6;
    }

    /* ══════════════════════════════════════
       サイドシート（右からスライド）
    ══════════════════════════════════════ */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.40);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 101;
      width: min(92vw, 420px);
      background: var(--surface);
      border-radius: 16px 0 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      padding-right: env(safe-area-inset-right, 0px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
      box-shadow: -4px 0 32px rgba(0,0,0,0.18);
    }
    .sheet.open { transform: translateX(0); }

    .sheet-handle { display: none; }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--surface);
      z-index: 1;
    }
    .sheet-title { font-size: 15px; font-weight: 700; color: var(--fg); }
    .sheet-close {
      min-width: 80px; height: 36px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 5px;
      color: var(--fg-sub); font-size: 13px; font-weight: 600;
      -webkit-tap-highlight-color: transparent;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .sheet-body {
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--fg-sub);
    }
    .sheet-body h3 {
      font-size: 14px; font-weight: 700; color: var(--accent);
      margin: 16px 0 8px; padding-left: 8px;
      border-left: 3px solid var(--open-dot);
    }
    .sheet-body h3:first-child { margin-top: 0; }
    .sheet-body p  { margin-bottom: 8px; color: var(--fg); }
    .sheet-body ul { margin: 4px 0 8px 18px; }
    .sheet-body li { margin-bottom: 4px; color: var(--fg); }
    .sheet-body table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
    .sheet-body th { background: var(--open-bg); color: var(--open-fg); padding: 7px 10px; text-align: left; border: 1px solid var(--border); }
    .sheet-body td { padding: 7px 10px; border: 1px solid var(--border); color: var(--fg); }
    .sheet-body tr:nth-child(even) td { background: var(--bg); }
    .sheet-body .note {
      font-size: 13px; color: var(--fg-sub);
      background: var(--bg); border-radius: 6px;
      padding: 10px 12px; margin-top: 8px; line-height: 1.7;
    }
    .sheet-status-bar {
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
    }
    .sheet-status-bar.closed { background: var(--closed-bg); color: var(--closed-fg); }
    .sheet-status-bar.notice { background: var(--notice-bg); color: var(--notice-fg); }
    .sheet-status-bar dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
    .sheet-status-bar dt { font-weight: 700; white-space: nowrap; }
    .sheet-status-bar dd { white-space: pre-wrap; min-width: 0; }

    /* （.card-tap-hint は上部のカード定義に統合済み） */
  </style>
</head>
<body>

<header>
  <span class="header-title">読谷村　くらしの案内板</span>
  <span class="header-live">
    <span class="live-dot"></span>リアルタイム
    <span id="head-time" style="opacity:.75;font-size:10px;"></span>
  </span>
</header>

<div class="summary-bar" id="summary-bar"></div>

<div class="grid" id="grid">

  <!-- ── ごみ収集カード（2列フルワイド・アコーディオン） ── -->
  <div class="gomi-card open" id="gomi-card">
    <div class="gomi-header" onclick="toggleGomi()">
      <span class="card-icon">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </span>
      <div class="gomi-title-wrap">
        <div class="gomi-title">ごみ収集日</div>
        <div class="gomi-today-date" id="gomi-today-date"></div>
        <div class="gomi-today-row" id="gomi-today-row"></div>
      </div>
      <div class="gomi-status-area">
        <span class="badge badge-open" id="gomi-status-badge">稼働中</span>
      </div>
    </div>
    <div class="gomi-status-detail" id="gomi-status-detail" style="display:none;"></div>
    <div class="gomi-expand-hint" id="gomi-expand-hint">▼ 直近3日と詳細を見る</div>
    <div class="gomi-body" id="gomi-body" style="display:none;">
      <span class="gomi-area-label">お住まいのエリアを選択</span>
      <select class="gomi-select" id="area-sel" onchange="saveArea();renderGomi()">
        <option value="1">① 高志保(1)・長浜(1)</option>
        <option value="2">② 波平(1)・上地・高志保(2)・座喜味(3)</option>
        <option value="3">③ 長浜(2)・瀬名波・渡慶次・儀間・宇座</option>
        <option value="4a">④-1 座喜味(1)（県営波平団地含）</option>
        <option value="4b">④-2 楚辺・波平(2)・座喜味(2)・都屋</option>
        <option value="5">⑤ 渡具知・古堅・大湾・比謝・比謝矼・伊良皆(1)・大木(1)</option>
        <option value="6">⑥ 喜名・横田・親志・座喜味(トーガー地域/シーレイク)・伊良皆(2)・大木(2)</option>
      </select>
      <div id="gomi-cards"></div>
      <div class="gomi-notes">
        <div class="gomi-note-row">
          <span class="gomi-note-icon">📄</span>
          <a href="https://cccc.backshelf.jp/bookview/?filseq=12401&page=1" target="_blank">ごみの分け方・出し方（PDF）</a>
        </div>
        <div class="gomi-note-row">
          <span class="gomi-note-icon">🕗</span>
          <span>収集日の<strong>朝8時30分まで</strong>に門前へ出してください</span>
        </div>
        <div class="gomi-note-row">
          <button class="gomi-typhoon-toggle" onclick="toggleTyphoon()">
            <span>🌀</span>
            <span id="typhoon-toggle-label">台風時のごみ出しについて ▼</span>
          </button>
        </div>
        <div id="typhoon-body" class="gomi-typhoon-body" style="display:none;">
          <p>「暴風警報」発令中、または業務中に「暴風警報」が発令される見込みで危険性がある場合は、ごみの収集を停止します。</p>

<script>
const GOMI_KEY = "yomitan_gomi_area_v1";
const GOMI_SCHEDULES = {
  "1":  { days: { 1:[{l:"もやせるごみ",c:"gomi-moe"}], 2:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 4:[{l:"もやせるごみ",c:"gomi-moe"}], 5:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[1,3]}] } },
  "2":  { days: { 1:[{l:"もやせるごみ",c:"gomi-moe"}], 2:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 3:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 4:[{l:"もやせるごみ",c:"gomi-moe"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[1,3]}] } },
  "3":  { days: { 1:[{l:"もやせるごみ",c:"gomi-moe"}], 3:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 4:[{l:"もやせるごみ",c:"gomi-moe"}], 5:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[1,3]}] } },
  "4a": { days: { 1:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 2:[{l:"もやせるごみ",c:"gomi-moe"}], 3:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 5:[{l:"もやせるごみ",c:"gomi-moe"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[1,3]}] } },
  "4b": { days: { 1:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 2:[{l:"もやせるごみ",c:"gomi-moe"}], 3:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 5:[{l:"もやせるごみ",c:"gomi-moe"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[1,3]}] } },
  "5":  { days: { 1:[{l:"もやせるごみ",c:"gomi-moe"}], 3:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 4:[{l:"もやせるごみ",c:"gomi-moe"}], 5:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[2,4]}] } },
  "6":  { days: { 1:[{l:"もやさないごみ・有害ごみ",c:"gomi-moe2"}], 2:[{l:"もやせるごみ",c:"gomi-moe"}], 4:[{l:"ペットボトル",c:"gomi-pet",w:[1,3]},{l:"古紙",c:"gomi-koshi",w:[2,4]}], 5:[{l:"もやせるごみ",c:"gomi-moe"}], 6:[{l:"ビン・スプレー缶",c:"gomi-bin",w:[2,4]}] } }
};
const DOW_JA = ["日","月","火","水","木","金","土"];
const MON_JA = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function weekOfMonth(d) { return Math.ceil(d.getDate() / 7); }
function getItems(key, date) {
  const s = GOMI_SCHEDULES[key]; if (!s) return [];
  const items = s.days[date.getDay()]; if (!items) return [];
  const wom = weekOfMonth(date);
  return items.filter(i => !i.w || i.w.includes(wom));
}
function getNext3(key) {
  const res = [], today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  let d = new Date(today), checked = 0;
  while (res.length < 3 && checked < 60) {
    if (!(d.getMonth()===0 && d.getDate()===1)) {
      const items = getItems(key, d);
      if (items.length) res.push({ date:new Date(d), items,
        isToday: d.getTime()===today.getTime(),
        isTomorrow: d.getTime()===tomorrow.getTime() });
    }
    d.setDate(d.getDate()+1); checked++;
  }
  return res;
}
function toggleTyphoon() {
  const body = document.getElementById("typhoon-body");
  const label = document.getElementById("typhoon-toggle-label");
  const open = body.style.display === "none";
  body.style.display = open ? "block" : "none";
  label.textContent = open ? "台風時のごみ出しについて ▲" : "台風時のごみ出しについて ▼";
}
// 今日の収集品目をヘッダーに表示
function renderTodaySummary(key) {
  const row      = document.getElementById("gomi-today-row");
  const dateEl   = document.getElementById("gomi-today-date");
  if (!row) return;
  const today = new Date(); today.setHours(0,0,0,0);
  if (dateEl) {
    dateEl.textContent = `${MON_JA[today.getMonth()]}${today.getDate()}日（${DOW_JA[today.getDay()]}）`;
  }
  const items = getItems(key, today);
  if (items.length) {
    row.innerHTML = items.map(i => `<span class="gomi-tag ${i.c}" style="font-size:10px;padding:2px 7px;">${i.l}</span>`).join("");
  } else {
    row.innerHTML = '<span class="gomi-today-none">本日の収集なし</span>';
  }
}

function renderGomi() {
  const key = document.getElementById("area-sel").value;
  renderTodaySummary(key);
  const days = getNext3(key);
  const container = document.getElementById("gomi-cards");
  container.innerHTML = "";
  days.forEach(({ date, items, isToday, isTomorrow }) => {
    const label = `${MON_JA[date.getMonth()]}${date.getDate()}日（${DOW_JA[date.getDay()]}）`;
    const badge = isToday    ? '<span class="gomi-today">今日</span>'
                : isTomorrow ? '<span class="gomi-tomorrow">明日</span>' : '';
    const tags = items.map(i => `<span class="gomi-tag ${i.c}">${i.l}</span>`).join("");
    const div = document.createElement("div");
    div.className = "gomi-day-card";
    div.innerHTML = `<span class="gomi-day-label">${label}</span>${badge}<div class="gomi-tags">${tags}</div>`;
    container.appendChild(div);
  });
}
function saveArea() {
  try { localStorage.setItem(GOMI_KEY, document.getElementById("area-sel").value); } catch(e) {}
}
function initGomi() {
  try { const s = localStorage.getItem(GOMI_KEY); if (s) document.getElementById("area-sel").value = s; } catch(e) {}
  renderGomi();
}
let gomiBodyOpen = false;
function toggleGomi() {
  gomiBodyOpen = !gomiBodyOpen;
  const body   = document.getElementById("gomi-body");
  const hint   = document.getElementById("gomi-expand-hint");
  body.style.display = gomiBodyOpen ? "" : "none";
  hint.textContent   = gomiBodyOpen ? "▲ 閉じる" : "▼ 直近3日と詳細を見る";
}
initGomi();
</script>

<!-- ══════════════════════════════════════
     Firebase / ステータス描画
══════════════════════════════════════ -->
<script type="module">
const C  = window.FS_CONFIG;
const FS = window.FS;
const IDS = C.services.map(s => s.id);   // ["gomi","kusaki","conveni"]
const manual = {}, scheds = {};

// ── カードのトグル ──
window.toggleCard = (id) => {
  const det  = document.getElementById("detail-" + id);
  if (!det) return;
  det.classList.toggle("open");
};

// ── ごみ収集ステータス描画 ──
function renderGomiStatus(d) {
  const isOpen = d.status !== "closed";
  const card   = document.getElementById("gomi-card");
  card.className = "gomi-card " + (isOpen ? "open" : "closed");

  const badge = document.getElementById("gomi-status-badge");
  badge.textContent = isOpen ? "稼働中" : "停止中";
  badge.className   = "badge " + (isOpen ? "badge-open" : "badge-closed");

  const detail = document.getElementById("gomi-status-detail");
  if (!isOpen && (d.period || d.reason || d.reopen_mode)) {
    let rows = "";
    if (d.period) rows += `<dt>停止期間</dt><dd>${FS.esc(d.period)}</dd>`;
    if (d.reason) rows += `<dt>停止理由</dt><dd>${FS.esc(d.reason)}</dd>`;
    const re = FS.fmtReopen(d); if (re) rows += `<dt>再開予定</dt><dd>${FS.esc(re)}</dd>`;
    detail.innerHTML = `<dl>${rows}</dl>`;
    detail.style.display = rows ? "" : "none";
  } else {
    detail.style.display = "none";
    detail.innerHTML = "";
  }
}

// ステータスデータを保持してシート表示に使う
const statusData = {};

// ── 草木・コンビニ ステータス描画 ──
function renderStatus(id, d) {
  const card = document.getElementById("card-" + id); if (!card) return;
  const isNotice = d.status === "notice";
  const isClosed = d.status === "closed";
  card.className = "card " + d.status;
  statusData[id] = d;   // シート表示時に参照

  // バッジ列
  const bcol = document.getElementById("badges-" + id);
  if (isClosed) {
    bcol.innerHTML = `<span class="badge badge-closed"><span class="bdot"></span>停止中</span>`;
  } else if (isNotice) {
    bcol.innerHTML = `<span class="badge badge-open"><span class="bdot"></span>稼働中</span>
      <span class="notice-pill"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>予告あり</span>`;
  } else {
    bcol.innerHTML = `<span class="badge badge-open"><span class="bdot"></span>稼働中</span>`;
  }
}

// ── ボトムシート開閉 ──
window.openSheet = (id) => {
  const d = statusData[id] || {};
  const isClosed = d.status === "closed";
  const isNotice = d.status === "notice";

  // ステータスバー（停止/予告時のみ）
  let statusBar = "";
  if (isClosed && (d.period || d.reason || d.reopen_mode)) {
    let rows = "";
    if (d.period) rows += `<dt>停止期間</dt><dd>${FS.esc(d.period)}</dd>`;
    if (d.reason) rows += `<dt>停止理由</dt><dd>${FS.esc(d.reason)}</dd>`;
    const re = FS.fmtReopen(d); if (re) rows += `<dt>再開予定</dt><dd>${FS.esc(re)}</dd>`;
    statusBar = `<div class="sheet-status-bar closed"><dl>${rows}</dl></div>`;
  } else if (isNotice && (d.notice_period || d.notice_msg)) {
    let rows = "";
    if (d.notice_period) rows += `<dt>予告期間</dt><dd>${FS.esc(d.notice_period)}</dd>`;
    if (d.notice_msg)    rows += `<dt>内容</dt><dd>${FS.esc(d.notice_msg)}</dd>`;
    statusBar = `<div class="sheet-status-bar notice"><dl>${rows}</dl></div>`;
  }

  const body = document.getElementById("sheet-body");
  body.innerHTML = statusBar + SHEET_CONTENT[id];
  document.getElementById("sheet-title").textContent = SHEET_TITLES[id] || "";
  document.getElementById("sheet-overlay").classList.add("open");
  document.getElementById("sheet-panel").classList.add("open");
  document.body.style.overflow = "hidden";
};
window.closeSheet = () => {
  document.getElementById("sheet-overlay").classList.remove("open");
  document.getElementById("sheet-panel").classList.remove("open");
  document.body.style.overflow = "";
};

function renderAll() {
  const now = Date.now();
  IDS.forEach(id => {
    const d = FS.effective(manual[id], scheds[id], now);
    if (id === "gomi") renderGomiStatus(d); else renderStatus(id, d);
  });
  renderSummary();
}

// ── サマリーバー ──
function renderSummary() {
  const counts = { open:0, notice:0, closed:0 };
  IDS.forEach(id => {
    const d = FS.effective(manual[id], scheds[id], Date.now());
    counts[d.status] = (counts[d.status] || 0) + 1;
  });
  const bar = document.getElementById("summary-bar");
  bar.innerHTML = [
    counts.open   ? `<span class="summary-chip"><span class="dot dot-open"></span>稼働中 ${counts.open}件</span>` : "",
    counts.notice ? `<span class="summary-chip"><span class="dot dot-notice"></span>予告あり ${counts.notice}件</span>` : "",
    counts.closed ? `<span class="summary-chip"><span class="dot dot-closed"></span>停止中 ${counts.closed}件</span>` : "",
  ].join("");
}

// ── ヘッダー時刻 ──
function updateTime() {
  const el = document.getElementById("head-time");
  if (el) el.textContent = new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}) + " 現在";
}
updateTime();
setInterval(updateTime, 30000);

// ── データ取得 ──
if (C.demo) {
  const load = () => {
    let db = {};
    try { db = JSON.parse(localStorage.getItem("fs_demo_db")) || {}; } catch(e) {}
    IDS.forEach(id => { manual[id] = (db.services||{})[id]; scheds[id] = (db.schedules_list||{})[id]; });
    renderAll();
  };
  window.addEventListener("storage", e => { if (e.key==="fs_demo_db") load(); });
  load();
} else {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const { getDatabase, ref, onValue } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const db = getDatabase(initializeApp(C.firebaseConfig));
  IDS.forEach(id => {
    onValue(ref(db, "services/"       + id), snap => { manual[id] = snap.val(); renderAll(); });
    onValue(ref(db, "schedules_list/" + id), snap => { scheds[id] = snap.val(); renderAll(); });
  });
}
setInterval(renderAll, 30000);
</script>
